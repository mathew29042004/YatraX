name: yatrax

x-core-env: &core-env
  DATABASE_URL: postgres://yatrax:${POSTGRES_PASSWORD:-yatrax}@postgres:5432/yatrax?sslmode=disable&pool_max_conns=48
  REDIS_URL: redis://redis:6379/0
  KAFKA_BROKERS: redpanda:9092
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-only-secret-at-least-32-chars}
  APP_ENV: development

# Shared by core (the merchant) and the mock gateway.
x-gateway-env: &gateway-env
  GATEWAY_KEY_ID: rzp_test_yatrax
  GATEWAY_KEY_SECRET: ${GATEWAY_KEY_SECRET:-dev-gateway-key-secret}
  GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-dev-gateway-webhook-secret}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yatrax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yatrax}
      POSTGRES_DB: yatrax
    ports: ["5433:5432"] # 5433 on the host: a local Postgres often already owns 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yatrax -d yatrax"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8090:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  # One-shot: runs migrations and seeds the synthetic railway world (skips if already seeded).
  seed:
    build: ./services/core
    command: ["/app/seed"]
    environment:
      <<: *core-env
      SEED_PASSENGERS: ${SEED_PASSENGERS:-50000}
      SEED_RANDOM: ${SEED_RANDOM:-42}
    depends_on:
      postgres: { condition: service_healthy }

  core:
    build: ./services/core
    command: ["/app/core"]
    environment:
      <<: [*core-env, *gateway-env]
      HTTP_ADDR: ":8080"
      GATEWAY_URL: http://payments:8081
      GATEWAY_PUBLIC_URL: http://localhost:8081
      PASSENGER_APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # YatraPay: the mock payment gateway. Admin controls at http://localhost:8081/admin
  payments:
    build: ./services/core
    command: ["/app/payments"]
    environment:
      <<: *gateway-env
      DATABASE_URL: postgres://yatrax:${POSTGRES_PASSWORD:-yatrax}@postgres:5432/yatrax?sslmode=disable&pool_max_conns=48
      CORE_WEBHOOK_URL: http://core:8080/v1/payments/webhook
      HTTP_ADDR: ":8081"
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: yatrax
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3100:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
